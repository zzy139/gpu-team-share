AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Builds the customized ParallelCluster UI Lambda image (linux/amd64) in AWS CodeBuild
  and pushes it to a private ECR repository. No local container runtime is needed.
  Usage: upload `git archive --format=zip HEAD` as s3://<SourceBucketName>/pcui-src.zip,
  then `aws codebuild start-build --project-name <ProjectName>
  --environment-variables-override name=IMAGE_TAG,value=<tag>,type=PLAINTEXT`.

Parameters:
  RepositoryName:
    Type: String
    Default: pcui-custom
    AllowedPattern: '^[a-z0-9][a-z0-9._/-]{1,255}$'
    Description: Name of the private ECR repository that receives the image.

Resources:
  ImageRepository:
    Type: AWS::ECR::Repository
    # The PCUI stack's Image Builder pipeline reads from this repository, so keep it
    # when the build stack is deleted.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true

  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSourceArchives
            Status: Enabled
            ExpirationInDays: 7

  SourceBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SourceBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SourceBucket.Arn
              - !Sub '${SourceBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/codebuild/pcui-custom-image
      RetentionInDays: 14

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PcuiImageBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSource
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub '${SourceBucket.Arn}/*'
              - Sid: WriteLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !GetAtt BuildLogGroup.Arn
                  - !Sub '${BuildLogGroup.Arn}:*'
              - Sid: EcrAuth
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ImageRepository.Arn

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: pcui-custom-image
      Description: Build the customized PCUI Lambda image and push it to private ECR
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_MEDIUM
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPO_NAME
            Type: PLAINTEXT
            Value: !Ref RepositoryName
          - Name: IMAGE_TAG
            Type: PLAINTEXT
            Value: latest
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Source:
        Type: S3
        Location: !Sub '${SourceBucket}/pcui-src.zip'
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - docker version
                # Avoid Docker Hub anonymous pull limits for frontend/Dockerfile
                - docker pull public.ecr.aws/docker/library/node:22.14-alpine
                - docker tag public.ecr.aws/docker/library/node:22.14-alpine node:22.14-alpine
            build:
              commands:
                - bash scripts/build_custom_image.sh --region "$AWS_REGION" --repo "$REPO_NAME" --tag "$IMAGE_TAG"
            post_build:
              commands:
                - docker image inspect --format 'architecture={{.Architecture}} os={{.Os}}' "$(docker images --format '{{.Repository}}:{{.Tag}}' | grep ":${IMAGE_TAG}$" | head -n1)" || true

Outputs:
  RepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  SourceBucketName:
    Value: !Ref SourceBucket
  ProjectName:
    Value: !Ref BuildProject

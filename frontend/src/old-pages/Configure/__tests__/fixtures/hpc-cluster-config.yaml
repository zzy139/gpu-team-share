SharedStorage:
  - MountDir: /efs
    Name: efs
    StorageType: Efs
    EfsSettings:
      FileSystemId: <EFS文件系统ID>
Monitoring:
  DetailedMonitoring: false
  Logs:
    CloudWatch:
      Enabled: true
      RetentionInDays: 14
      DeletionPolicy: Retain
  Dashboards:
    CloudWatch:
      Enabled: true
